<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Gaurav Rawat — Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1f"/>
      <stop offset="0.55" stop-color="#1b1640"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="r"><rect width="1000" height="230" rx="14"/></clipPath>
  </defs>
  <style>
    .name{font:800 56px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:-1px}
    .role{font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:3px}
    .tag{font:500 14px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .fade1{opacity:0;animation:up .9s ease-out .1s forwards}
    .fade2{opacity:0;animation:up .9s ease-out .45s forwards}
    .fade3{opacity:0;animation:up .9s ease-out .8s forwards}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .dot{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <rect width="1000" height="230" fill="url(#grid)"/>
    <circle cx="860" cy="40" r="140" fill="#7c3aed" opacity="0.18"/>
    <circle cx="120" cy="210" r="120" fill="#22d3ee" opacity="0.08"/>
    <path fill="url(#wave)" opacity="0.5">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M0 200 C 250 170, 500 230, 1000 190 L1000 230 L0 230 Z;
                M0 190 C 300 230, 650 165, 1000 205 L1000 230 L0 230 Z;
                M0 200 C 250 170, 500 230, 1000 190 L1000 230 L0 230 Z"/>
    </path>
    <path fill="#0d1117" opacity="0.85">
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="M0 215 C 300 195, 600 235, 1000 210 L1000 230 L0 230 Z;
                M0 210 C 350 235, 700 195, 1000 220 L1000 230 L0 230 Z;
                M0 215 C 300 195, 600 235, 1000 210 L1000 230 L0 230 Z"/>
    </path>
  </g>
  <g class="fade1"><text class="name" x="500" y="98" text-anchor="middle" fill="url(#name)">Gaurav Rawat</text></g>
  <g class="fade2"><text class="role" x="500" y="138" text-anchor="middle" fill="#a78bfa">FULL STACK DEVELOPER</text></g>
  <g class="fade3">
    <circle class="dot" cx="331" cy="168" r="4.5" fill="#22c55e"/>
    <text class="tag" x="343" y="173" fill="#8b949e">React · Next.js · Node.js · PostgreSQL · AI</text>
  </g>
</svg>
